[project]
name = "pdp-guardian"
version = "0.1.0"
description = "Audits running systems for Indonesian personal data and produces per-article evidence against UU PDP and PP 33/2026."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.161.1",
    "lokal-id>=0.6.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.ruff]
target-version = "py312"
line-length = 100