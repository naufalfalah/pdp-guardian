[project]
name = "pdp-guardian"
version = "0.1.0"
description = "Audits running systems for Indonesian personal data and produces per-article evidence against UU PDP and PP 33/2026."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.161.1",
    "jinja2>=3.1.6",
    "lokal-id>=0.6.0",
    "psycopg[binary]>=3.3.6",
    "pymysql>=1.2.3",
    "pyyaml>=6.0.3",
    "uvicorn>=0.54.0",
]

[project.scripts]
pdp-guardian = "pdp_guardian.cli:main"

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # import sorting
    "UP",      # pyupgrade (modern syntax for 3.12)
    "B",       # bugbear (common bugs)
    "SIM",     # simplifications
]

[tool.pytest.ini_options]
testpaths = ["tests"]
